name: Aprobar paper

on:
  issue_comment:
    types: [created]

jobs:
  aprobar:
    if: contains(github.event.issue.labels.*.name, 'papers-borrador')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Procesar aprobación
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/approve_paper.py
